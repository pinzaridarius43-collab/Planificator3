<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planificatorul meu de 7 zile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #1e3630;
    --board-deep: #152a24;
    --chalk: #f5f3e7;
    --chalk-dim: #c9d6cf;
    --yellow: #f4c95d;
    --coral: #f08a5d;
    --blue: #6fb1d6;
    --mint: #6fcf97;
    --lavender: #b79ced;
    --pink: #e98cc1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: border-box; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--board);
    background-image:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.03), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(255,255,255,0.025), transparent 55%);
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    min-height: 100%;
    padding: 28px 16px 60px;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
  }
  header{
    text-align: center;
    margin-bottom: 22px;
  }
  header h1{
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 40px);
    margin: 0 0 6px;
    text-shadow: 0 0 14px rgba(245,243,231,0.25);
    transform: rotate(-1deg);
  }
  header p{
    margin: 0;
    color: var(--chalk-dim);
    font-size: 14px;
  }

  /* day tabs */
  .day-tabs{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 14px;
    margin-bottom: 6px;
    -webkit-overflow-scrolling: touch;
  }
  .day-tabs::-webkit-scrollbar{ height: 4px; }
  .day-tab{
    flex: 0 0 auto;
    font-family: 'Kalam', cursive;
    font-size: 16px;
    color: var(--chalk-dim);
    background: transparent;
    border: 2px dashed rgba(245,243,231,0.25);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .day-tab:hover{ transform: translateY(-2px); }
  .day-tab.active{
    color: var(--board);
    background: var(--chalk);
    border-color: var(--chalk);
    border-style: solid;
    transform: rotate(-1deg);
  }
  .day-tab .pct{
    display: block;
    font-family: 'Work Sans', sans-serif;
    font-size: 10px;
    font-weight: 600;
    opacity: 0.7;
  }
  .day-tab.complete{
    border-color: var(--mint);
    border-style: solid;
  }
  .day-tab.complete .pct{
    color: var(--mint);
    opacity: 1;
  }
  .day-tab.complete.active{
    background: var(--mint);
    color: var(--board-deep);
  }
  .day-tab .badge{
    display: inline-block;
    margin-left: 3px;
  }

  /* day progress */
  .day-progress{
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 20px;
    color: var(--chalk-dim);
    font-size: 13px;
  }
  .day-progress .track{
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: rgba(245,243,231,0.12);
    overflow: hidden;
  }
  .day-progress .fill{
    height: 100%;
    background: linear-gradient(90deg, var(--mint), var(--blue));
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  /* category cards */
  .cat{
    border: 2px dashed var(--cat-color, var(--chalk));
    border-radius: 14px;
    padding: 14px 16px 16px;
    margin-bottom: 14px;
    background: rgba(255,255,255,0.02);
  }
  .cat:nth-child(odd){ transform: rotate(-0.4deg); }
  .cat:nth-child(even){ transform: rotate(0.4deg); }
  .cat-head{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cat-head .emoji{ font-size: 20px; }
  .cat-head h2{
    font-family: 'Kalam', cursive;
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    color: var(--cat-color, var(--chalk));
  }

  /* list tasks */
  .task-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(245,243,231,0.12);
  }
  .task-row:last-of-type{ border-bottom: none; }
  .task-check{
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 2px solid var(--cat-color, var(--chalk));
    flex: 0 0 auto;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .task-check.done{ background: var(--cat-color, var(--chalk)); }
  .task-check.done::after{
    content: '✓';
    color: var(--board-deep);
    font-size: 13px;
    font-weight: 700;
  }
  .task-text{
    flex: 1;
    font-size: 14.5px;
    line-height: 1.3;
  }
  .task-text.done{ text-decoration: line-through; opacity: 0.5; }
  .task-del{
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .task-del:hover{ color: var(--coral); }
  .empty-hint{
    font-size: 13px;
    color: var(--chalk-dim);
    font-style: italic;
    padding: 4px 0;
  }
  .add-row{
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .add-row input[type="text"]{
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(245,243,231,0.2);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
  }
  .add-row input[type="text"]::placeholder{ color: rgba(245,243,231,0.4); }
  .add-row input[type="text"]:focus, .task-check:focus-visible, .day-tab:focus-visible, .hours-input:focus, .note-area:focus{
    outline: 2px solid var(--chalk);
    outline-offset: 2px;
  }
  .add-row button{
    background: var(--cat-color, var(--chalk));
    color: var(--board-deep);
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .add-row button:hover{ filter: brightness(1.08); }

  /* hours-type categories */
  .hours-row{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hours-input{
    width: 72px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(245,243,231,0.2);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    text-align: center;
  }
  .hours-label{ font-size: 13.5px; color: var(--chalk-dim); }
  .hours-meter{
    flex: 1;
    height: 8px;
    border-radius: 5px;
    background: rgba(245,243,231,0.12);
    overflow: hidden;
  }
  .hours-meter .fill{
    height: 100%;
    background: var(--cat-color, var(--chalk));
    border-radius: 5px;
    transition: width 0.3s ease;
  }
  .cat-note{
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--chalk-dim);
  }

  .day-note{
    margin-top: 4px;
  }
  .day-note label{
    font-family: 'Kalam', cursive;
    font-size: 16px;
    display: block;
    margin-bottom: 6px;
    color: var(--chalk);
  }
  .note-area{
    width: 100%;
    min-height: 60px;
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(245,243,231,0.25);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--chalk);
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    resize: vertical;
  }
  .note-area::placeholder{ color: rgba(245,243,231,0.35); }

  /* weekly overview */
  .week-section{
    margin-top: 34px;
    border-top: 2px dashed rgba(245,243,231,0.2);
    padding-top: 20px;
  }
  .week-section h2{
    font-family: 'Kalam', cursive;
    font-size: 22px;
    margin: 0 0 4px;
    transform: rotate(-0.6deg);
  }
  .week-section > p{
    color: var(--chalk-dim);
    font-size: 13px;
    margin: 0 0 16px;
  }
  .week-grid{
    display: grid;
    grid-template-columns: 120px repeat(7, 1fr);
    gap: 4px;
    overflow-x: auto;
    font-size: 12px;
  }
  .week-grid .row-label{
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--chalk-dim);
    white-space: nowrap;
    padding-right: 4px;
  }
  .week-grid .col-label{
    text-align: center;
    color: var(--chalk-dim);
    padding-bottom: 4px;
    font-family: 'Kalam', cursive;
  }
  .week-cell{
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid rgba(245,243,231,0.15);
  }
  .dot{
    width: 9px; height: 9px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .reset-row{
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 26px;
  }
  .reset-btn{
    background: none;
    border: 1px dashed rgba(245,243,231,0.3);
    color: var(--chalk-dim);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12.5px;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
  }
  .reset-btn:hover{ color: var(--coral); border-color: var(--coral); }

  @media (max-width: 480px){
    .week-grid{ grid-template-columns: 90px repeat(7, minmax(28px,1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Planificatorul meu de 7 zile</h1>
    <p>Școală · teme · somn · mișcare · hobby · timp digital — o săptămână, în echilibru.</p>
  </header>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="day-progress">
    <span id="progressLabel">0%</span>
    <div class="track"><div class="fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div id="dayPanel"></div>

  <div class="day-note">
    <label for="dayNoteArea">Notă pentru ziua asta</label>
    <textarea class="note-area" id="dayNoteArea" placeholder="Ceva de reținut pentru azi..."></textarea>
  </div>

  <div class="reset-row">
    <button class="reset-btn" id="resetDayBtn">golește ziua curentă</button>
    <button class="reset-btn" id="resetWeekBtn">golește toată săptămâna</button>
  </div>

  <div class="week-section">
    <h2>Vedere pe săptămână</h2>
    <p>Fiecare pătrățel se colorează pe măsură ce bifezi activități sau completezi orele.</p>
    <div class="week-grid" id="weekGrid"></div>
  </div>
</div>

<script>
(function(){
  const DAYS = ['Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă','Duminică'];
  const DAYS_SHORT = ['Lu','Ma','Mi','Jo','Vi','Sâ','Du'];

  const CATS = [
    { key:'scoala',  label:'Activități școlare',   type:'list',  color:'var(--yellow)',    emoji:'🏫' },
    { key:'teme',    label:'Teme',                 type:'list',  color:'var(--coral)',     emoji:'📝' },
    { key:'somn',    label:'Odihnă și somn',       type:'hours', color:'var(--blue)',      emoji:'😴', max:12, unit:'ore de somn' },
    { key:'sport',   label:'Activitate fizică',     type:'list',  color:'var(--mint)',      emoji:'🏃' },
    { key:'hobby',   label:'Hobby și timp liber',   type:'list',  color:'var(--lavender)',  emoji:'🎨' },
    { key:'digital', label:'Timp digital',          type:'hours', color:'var(--pink)',      emoji:'📱', max:8,  unit:'ore de ecran' }
  ];

  const STORAGE_KEY = 'planificator7zile-v1';

  const EXAMPLE_CONTENT = {
    'Luni':     { scoala:['Curs de matematică','Curs de română'], teme:['Temă la matematică','Citit 10 pagini la română'], somn:'8', sport:['30 min mers pe jos'], hobby:['20 min desen'], digital:'1.5', note:'Zi obișnuită de școală — nimic special.' },
    'Marți':    { scoala:['Curs de engleză','Curs de biologie'], teme:['Exerciții la engleză','Proiect la biologie'], somn:'8', sport:['Antrenament de fotbal'], hobby:['Ascultat muzică'], digital:'2', note:'' },
    'Miercuri': { scoala:['Curs de istorie','Curs de fizică'], teme:['Rezumat la istorie','Probleme la fizică'], somn:'7.5', sport:['Alergare 20 min'], hobby:['Citit o carte'], digital:'1', note:'' },
    'Joi':      { scoala:['Curs de chimie','Curs de geografie'], teme:['Fișă la chimie','Hartă la geografie'], somn:'8', sport:['Bicicletă 30 min'], hobby:['Jucat un joc video'], digital:'2', note:'' },
    'Vineri':   { scoala:['Curs de informatică','Curs de educație fizică'], teme:['Exercițiu de programare'], somn:'8.5', sport:['Fotbal cu prietenii'], hobby:['Film sau serial'], digital:'2.5', note:'Ultima zi de școală din săptămână!' },
    'Sâmbătă':  { scoala:['Recapitulare ușoară'], teme:['Cititul unei cărți suplimentare'], somn:'9', sport:['Drumeție sau plimbare lungă'], hobby:['Timp cu prietenii'], digital:'3', note:'' },
    'Duminică': { scoala:['Pregătire ghiozdan pentru săptămâna viitoare'], teme:['Recapitulare pentru luni'], somn:'9', sport:['Joc afară'], hobby:['Timp cu familia'], digital:'2', note:'Odihnă înainte de o săptămână nouă.' }
  };

  function emptyDay(){
    const d = {};
    CATS.forEach(c => {
      if (c.type === 'list') d[c.key] = [];
      else d[c.key] = '';
    });
    d.note = '';
    return d;
  }

  function exampleDay(day){
    const ex = EXAMPLE_CONTENT[day];
    const d = {};
    CATS.forEach(c => {
      if (c.type === 'list'){
        d[c.key] = (ex[c.key] || []).map(text => ({ id: uid(), text, done: true }));
      } else {
        d[c.key] = ex[c.key] || '';
      }
    });
    d.note = ex.note || '';
    return d;
  }

  function emptyData(){
    const data = {};
    DAYS.forEach(day => data[day] = emptyDay());
    return data;
  }

  function exampleData(){
    const data = {};
    DAYS.forEach(day => data[day] = exampleDay(day));
    return data;
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return exampleData();
      const parsed = JSON.parse(raw);
      const data = emptyData();
      DAYS.forEach(day => {
        if (parsed[day]) Object.assign(data[day], parsed[day]);
      });
      return data;
    }catch(e){
      console.error('Nu am putut citi datele salvate:', e);
      return exampleData();
    }
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    }catch(e){
      console.error('Nu am putut salva datele:', e);
    }
  }

  let uidCounter = 1;
  function uid(){ return 'id' + (uidCounter++) + '-' + Math.random().toString(36).slice(2,7); }

  const state = {
    data: loadData(),
    activeDay: DAYS[0]
  };

  function dayRatio(day){
    const d = state.data[day];
    let sum = 0;
    CATS.forEach(c => {
      if (c.type === 'list'){
        const list = d[c.key];
        sum += list.length ? (list.filter(t => t.done).length / list.length) : 0;
      } else {
        const v = parseFloat(d[c.key]);
        sum += (!isNaN(v) && v > 0) ? 1 : 0;
      }
    });
    return sum / CATS.length;
  }

  function catRatio(day, catKey){
    const c = CATS.find(c => c.key === catKey);
    const d = state.data[day];
    if (c.type === 'list'){
      const list = d[c.key];
      return list.length ? (list.filter(t => t.done).length / list.length) : 0;
    } else {
      const v = parseFloat(d[c.key]);
      return (!isNaN(v) && v > 0) ? 1 : 0;
    }
  }

  function renderDayTabs(){
    const wrap = document.getElementById('dayTabs');
    wrap.innerHTML = '';
    DAYS.forEach((day, i) => {
      const btn = document.createElement('button');
      const pct = Math.round(dayRatio(day) * 100);
      const isComplete = pct === 100;
      btn.className = 'day-tab'
        + (day === state.activeDay ? ' active' : '')
        + (isComplete ? ' complete' : '');
      btn.innerHTML = DAYS_SHORT[i] + (isComplete ? '<span class="badge">✓</span>' : '')
        + '<span class="pct">' + pct + '%</span>';
      btn.setAttribute('aria-label', day + (isComplete ? ' — zi completă' : ''));
      btn.addEventListener('click', () => {
        state.activeDay = day;
        renderAll();
      });
      wrap.appendChild(btn);
    });
  }

  function renderProgress(){
    const pct = Math.round(dayRatio(state.activeDay) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = pct === 100
      ? '🎉 ' + state.activeDay + ' e completă!'
      : pct + '% din ' + state.activeDay;
  }

  function renderListCat(container, cat){
    const day = state.activeDay;
    const d = state.data[day];
    const list = d[cat.key];

    const card = document.createElement('div');
    card.className = 'cat';
    card.style.setProperty('--cat-color', cat.color);

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<span class="emoji">' + cat.emoji + '</span><h2>' + cat.label + '</h2>';
    card.appendChild(head);

    if (!list.length){
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'Nimic adăugat încă — scrie prima activitate mai jos.';
      card.appendChild(hint);
    }

    list.forEach(task => {
      const row = document.createElement('div');
      row.className = 'task-row';

      const check = document.createElement('button');
      check.className = 'task-check' + (task.done ? ' done' : '');
      check.setAttribute('aria-label', task.done ? 'Marchează ca nefăcut' : 'Marchează ca făcut');
      check.addEventListener('click', () => {
        task.done = !task.done;
        saveData();
        renderAll();
      });

      const text = document.createElement('span');
      text.className = 'task-text' + (task.done ? ' done' : '');
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'task-del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Șterge');
      del.addEventListener('click', () => {
        d[cat.key] = list.filter(t => t.id !== task.id);
        saveData();
        renderAll();
      });

      row.appendChild(check);
      row.appendChild(text);
      row.appendChild(del);
      card.appendChild(row);
    });

    const addRow = document.createElement('div');
    addRow.className = 'add-row';
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Adaugă o activitate...';
    const addBtn = document.createElement('button');
    addBtn.textContent = 'Adaugă';

    function addTask(){
      const val = input.value.trim();
      if (!val) return;
      list.push({ id: uid(), text: val, done: false });
      input.value = '';
      saveData();
      renderAll();
    }
    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

    container.appendChild(card);
  }

  function renderHoursCat(container, cat){
    const day = state.activeDay;
    const d = state.data[day];

    const card = document.createElement('div');
    card.className = 'cat';
    card.style.setProperty('--cat-color', cat.color);

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = '<span class="emoji">' + cat.emoji + '</span><h2>' + cat.label + '</h2>';
    card.appendChild(head);

    const row = document.createElement('div');
    row.className = 'hours-row';

    const input = document.createElement('input');
    input.className = 'hours-input';
    input.type = 'number';
    input.min = '0';
    input.max = String(cat.max);
    input.step = '0.5';
    input.value = d[cat.key] || '';
    input.setAttribute('aria-label', cat.unit);

    const meter = document.createElement('div');
    meter.className = 'hours-meter';
    const fill = document.createElement('div');
    fill.className = 'fill';
    const v = parseFloat(d[cat.key]) || 0;
    fill.style.width = Math.min(100, (v / cat.max) * 100) + '%';
    meter.appendChild(fill);

    input.addEventListener('input', () => {
      d[cat.key] = input.value;
      saveData();
      const nv = parseFloat(input.value) || 0;
      fill.style.width = Math.min(100, (nv / cat.max) * 100) + '%';
      renderDayTabs();
      renderProgress();
      renderWeekGrid();
    });

    row.appendChild(input);
    row.appendChild(meter);
    card.appendChild(row);

    const note = document.createElement('div');
    note.className = 'cat-note';
    note.textContent = cat.unit + ' astăzi (din maxim ' + cat.max + ' pe bara de referință)';
    card.appendChild(note);

    container.appendChild(card);
  }

  function renderDayPanel(){
    const panel = document.getElementById('dayPanel');
    panel.innerHTML = '';
    CATS.forEach(cat => {
      if (cat.type === 'list') renderListCat(panel, cat);
      else renderHoursCat(panel, cat);
    });

    const noteArea = document.getElementById('dayNoteArea');
    noteArea.value = state.data[state.activeDay].note || '';
  }

  function renderWeekGrid(){
    const grid = document.getElementById('weekGrid');
    grid.innerHTML = '';

    grid.appendChild(document.createElement('div'));
    DAYS_SHORT.forEach(ds => {
      const lbl = document.createElement('div');
      lbl.className = 'col-label';
      lbl.textContent = ds;
      grid.appendChild(lbl);
    });

    CATS.forEach(cat => {
      const rowLabel = document.createElement('div');
      rowLabel.className = 'row-label';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = cat.color;
      rowLabel.appendChild(dot);
      rowLabel.appendChild(document.createTextNode(cat.emoji));
      grid.appendChild(rowLabel);

      DAYS.forEach(day => {
        const ratio = catRatio(day, cat.key);
        const cell = document.createElement('div');
        cell.className = 'week-cell';
        cell.title = day + ' · ' + cat.label + ': ' + Math.round(ratio * 100) + '%';
        const opacity = ratio > 0 ? 0.18 + ratio * 0.82 : 0.06;
        cell.style.background = cat.color;
        cell.style.opacity = opacity.toFixed(2);
        grid.appendChild(cell);
      });
    });
  }

  function renderAll(){
    renderDayTabs();
    renderProgress();
    renderDayPanel();
    renderWeekGrid();
  }

  document.getElementById('dayNoteArea').addEventListener('input', e => {
    state.data[state.activeDay].note = e.target.value;
    saveData();
  });

  document.getElementById('resetDayBtn').addEventListener('click', () => {
    if (!confirm('Golești toate activitățile pentru ' + state.activeDay + '?')) return;
    state.data[state.activeDay] = emptyDay();
    saveData();
    renderAll();
  });

  document.getElementById('resetWeekBtn').addEventListener('click', () => {
    if (!confirm('Golești toată săptămâna? Nu se poate anula.')) return;
    state.data = emptyData();
    saveData();
    renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
